
<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: layout(~{::title}, ~{::main})}">

<head>
    <title>Connexion</title>
</head>

<body>

<main class="login-page flex-grow-1 d-flex align-items-center justify-content-center p-4">

    <section class="login-card">

        <!-- En-tête du formulaire -->
        <div class="login-heading">
            <h2>Bienvenue</h2>
            <p>Connectez-vous à votre espace personnel</p>
        </div>

        <!-- Identifiants incorrects -->
        <div th:if="${param.error}"
             class="alert alert-danger"
             role="alert">
            Adresse e-mail ou mot de passe incorrect,
            ou compte désactivé.
        </div>

        <!-- Déconnexion réussie -->
        <div th:if="${param.logout}"
             class="alert alert-success"
             role="status">
            Vous avez été déconnecté avec succès.
        </div>

        <!-- Formulaire de connexion -->
        <form th:action="@{/login}" method="post">

            <!-- Adresse e-mail -->
            <div class="mb-3">

                <label for="email" class="form-label">
                    Adresse e-mail
                </label>

                <input type="email"
                       class="form-control login-input"
                       id="email"
                       name="email"
                       placeholder="Votre adresse e-mail"
                       autocomplete="username"
                       required
                       autofocus>

            </div>

            <!-- Mot de passe -->
            <div class="mb-4">

                <label for="password" class="form-label">
                    Mot de passe
                </label>

                <input type="password"
                       class="form-control login-input"
                       id="password"
                       name="password"
                       placeholder="Votre mot de passe"
                       autocomplete="current-password"
                       required>

            </div>

            <!-- Bouton de connexion -->
            <button type="submit"
                    class="btn btn-primary login-submit w-100">
                Se connecter
            </button>

        </form>

        <!-- Information -->
        <div class="login-information">
            <p>
                Vous ne possédez pas de compte ?
                <br>
                Contactez votre administrateur.
            </p>
        </div>

    </section>

</main>

</body>
</html>
